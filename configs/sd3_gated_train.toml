[general]
pretrained_model_name_or_path = "/data/cc/models/sd3.5_medium.safetensors"
clip_l = "/data/cc/models/clip_l.safetensors"
clip_g = "/data/cc/models/clip_g.safetensors"
t5xxl = "/data/cc/models/t5xxl_fp16.safetensors"
dataset_config = "./configs/zimage_dataset.toml"
output_dir = "/data/cc/sd3_gated"
output_name = "sd35m_gated"
logging_dir = "/data/cc/sd3_gated/logs"
log_with = "tensorboard"

mixed_precision = "bf16"
full_bf16 = false
train_batch_size = 1
gradient_accumulation_steps = 4
gradient_checkpointing = true
learning_rate = 1e-5
max_grad_norm = 1.0
max_train_epochs = 20
save_every_n_epochs = 1
optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.1", "betas=0.9,0.99"]
lr_scheduler = "cosine_with_restarts"
lr_scheduler_num_cycles = 20
lr_scheduler_min_lr_ratio = 0.1
lr_warmup_steps = 1000
deepspeed = true
zero_stage = 1

cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
vae_batch_size = 1
text_encoder_batch_size = 1
skip_cache_check = false

gate_type = "headwise"
gate_layers = "24-36"
log_gate_stats = true
log_gate_stats_interval = 100
